[project]
name = "magic-detector"
version = "0.1.0"
description = "Hybrid file type and magic bytes detector supporting python-magic and google/magika"
readme = "README.md"
license = "MIT"
authors = [{ name = "JSON Schema Transformer Team" }]
keywords = ["magic", "file-type", "mime", "magika", "libmagic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "magika>=0.5.0",
]

[project.optional-dependencies]
magic = ["python-magic>=0.4.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
