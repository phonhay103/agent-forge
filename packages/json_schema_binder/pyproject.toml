[project]
name = "json-schema-binder"
version = "0.1.0"
description = "Deterministic and schema-aware variable binding engine for JSON and Pydantic payloads"
readme = "README.md"
license = "MIT"
authors = [{ name = "JSON Schema Transformer Team" }]
keywords = ["json-schema", "variable-binding", "jmespath", "jsonpath", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "jmespath>=1.0.0",
    "jsonpath-ng>=1.6.0",
]

[project.optional-dependencies]
llm = [
    "langchain-core>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

