[project]
name = "agent-forge"
version = "0.1.0"
description = "AgentForge — Multi-step AI Agent Orchestration & Execution Framework"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "json-schema-binder",
    # Pinned so 0.3 (a breaking release) cannot slip in. Bump deliberately when a
    # newer prompt-composer release is needed.
    "prompt-composer==0.2.0",
    "magic-detector",
    "fastmcp>=3.4.5",
    "mcp>=1.29.0",
    "pydantic>=2.13.4",
    "jmespath>=1.1.0",
    "python-dotenv>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "jsonpath-ng>=1.8.0",
    "langchain>=1.3.14",
    "langchain-openrouter>=0.2.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.3.0",
    "ty>=0.0.69",
]

[tool.uv]
# Supply-chain lag: a release must be 7 days old before the resolver may pick
# it. Malicious or broken uploads are usually yanked within hours, so waiting
# turns the registry's own recall into our safety net. Relative on purpose —
# it is re-evaluated at every lock, not frozen to one date.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
json-schema-binder = { workspace = true }
magic-detector = { workspace = true }


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "ANN",   # flake8-annotations (prevent Any via ANN401)
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify (simplify logic)
    "RUF",   # Ruff specific rules
]
ignore = [
    "ANN002", # Do not require type annotation for *args
    "ANN003", # Do not require type annotation for **kwargs
    "ANN401", # Dynamically typed expressions (typing.Any) are allowed

    # --- Resolve conflicts with Formatter ---
    "COM812", # Ignore missing trailing comma warnings (handled by formatter)
    "ISC002", # Ignore implicit string concatenation warnings

    # --- Design philosophy optimizing ruff format ---
    "E501",   # Ignore line length limit (delegated to ruff format)
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["json_schema_binder", "magic_detector"]

[tool.ruff.lint.per-file-ignores]
# Allow assert in testing, relax type annotation requirements
"tests/**/*.py" = ["S101", "S105", "S106", "ANN", "ARG", "E402", "SIM117", "RUF059"]
"packages/*/tests/**/*.py" = ["S101", "S105", "S106", "ANN", "ARG", "E402", "SIM117", "RUF059", "W293", "I001"]

# Protect package initialization files from unused imports (keep exported imports)
"__init__.py" = ["F401"]

# Relax checks for scripts/ files
"scripts/**/*.py" = ["SIM", "ARG"]


[tool.ty]

[tool.ty.src]
include = ["src", "packages/json_schema_binder/src", "packages/magic_detector/src"]

[tool.ty.rules]
all = "error"
