[project]
name = "json-schema-transformer"
version = "0.1.0"
description = "MCP Headless Execution Engine & Schema Transformer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "json-schema-binder",
    "prompt-composer",
    "fastmcp>=3.4.5",
    "mcp>=1.29.0",
    "pydantic>=2.13.4",
    "jmespath>=1.1.0",
    "python-dotenv>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "jsonpath-ng>=1.8.0",
    "langchain>=1.3.14",
    "langchain-openrouter>=0.2.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
json-schema-binder = { workspace = true }
prompt-composer = { workspace = true }
